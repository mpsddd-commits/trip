# ---------------------------------------------------------------------------
# u3-trip-android 빌드 설정
#
# 🔴 ABR-01 — 접속 주소는 **여기 또는 -PbaseUrl 로만** 주입한다.
#    Kotlin 소스에 주소 리터럴을 두지 않는다. 구조 테스트가 이를 강제한다.
# ---------------------------------------------------------------------------

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# --- 접속 주소 -------------------------------------------------------------
# debug 기본값: 에뮬레이터에서 호스트 루프백을 가리킨다 (CA-1).
#   실기기로 붙을 때는 빌드 시 덮어쓴다:
#     gradle assembleDebug -PbaseUrl=http://192.168.0.10:8200 -PcleartextHost=192.168.0.10
baseUrl=http://10.0.2.2:8200

# release 기본값은 **의도적으로 비워 둔다** (ABR-02).
# 비어 있으면 앱이 WebView 를 띄우지 않고 설정 오류 화면을 보여준다.
#   gradle assembleRelease -PreleaseBaseUrl=https://trip.example.com
releaseBaseUrl=

# debug 빌드에서 평문 HTTP 를 허용할 **추가** 호스트 (ABR-05).
# 10.0.2.2 / localhost / 127.0.0.1 은 이미 허용돼 있다. 실기기 IP 만 여기에 넣는다.
# 비워 두면 아무것도 추가되지 않는다.
cleartextHost=
