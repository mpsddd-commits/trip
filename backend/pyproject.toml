[project]
name = "trip-backend"
version = "0.1.0"
description = "trip - 여행 일정 생성 + 시간표 + 네이버지도 연동 백엔드 (u1-trip-backend)"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "property: 속성 기반 테스트 (PBT)",
]

# NOTE: Hypothesis 는 pyproject.toml 을 읽지 않는다.
#       PBT-08(셰링킹 활성 + 시드/최소 반례 출력) 설정은 tests/conftest.py 에서
#       settings 프로파일로 등록한다.
