name: CI

# 이 프로젝트의 테스트는 장식이 아닙니다.
# 개발 과정에서 **실제 결함 11건**을 잡았고, 그중 여럿은 오류를 내지 않는 종류였습니다
# (2개짜리 하루가 재정렬되지 않음 / 영업시간이 200 응답과 함께 사라짐 / 시각이 9시간 어긋남).
# 그래서 CI 는 전부 통과해야 머지합니다.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 같은 브랜치에 새 푸시가 오면 진행 중인 실행을 취소합니다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  backend:
    name: u1 백엔드 (pytest + Hypothesis)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 🔴 3.12 로 고정합니다 (UD-9).
          #    3.13 이상에서는 pydantic-core 휠이 없어 설치가 실패합니다.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: 의존성 설치
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: 테스트
        working-directory: backend
        run: pytest -q --junitxml=../test-results-backend.xml

      - name: 테스트 결과 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-backend
          path: test-results-backend.xml
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  web:
    name: u2 웹 (tsc + Vitest + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 의존성 설치
        working-directory: web
        run: npm ci

      - name: 타입 검사
        working-directory: web
        run: npm run typecheck

      - name: 테스트 (구조 테스트 18건 포함)
        working-directory: web
        run: npm test

      - name: 빌드
        working-directory: web
        run: npm run build

      - name: 번들 크기 확인
        working-directory: web
        run: |
          # NFR — 초기 번들 gzip 1MB 이하. 실측은 약 94KB 입니다.
          TOTAL=$(find dist/assets -name '*.js' -exec gzip -c {} \; | wc -c)
          echo "gzip 합계: $((TOTAL / 1024)) KB"
          if [ "$TOTAL" -gt 1048576 ]; then
            echo "::error::번들이 1MB 를 넘었습니다"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  contract:
    name: 🔴 API 계약 (OpenAPI ↔ TS 타입 동기화)
    runs-on: ubuntu-latest
    # 🔴 UD-3 계약 ① — 백엔드 API 를 바꾸고 타입 재생성을 잊으면
    #    웹은 **낡은 타입으로 컴파일에 성공**하고 런타임에서만 깨집니다.
    #    여기서 실제 스키마와 커밋된 타입을 대조합니다.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 백엔드 의존성
        working-directory: backend
        run: pip install -r requirements.txt

      - name: OpenAPI 스키마 추출
        working-directory: backend
        env:
          DATABASE_PATH: ":memory:"
          LOG_DIR: /tmp/trip-logs
          STATIC_DIR: /tmp/trip-static
        run: |
          python -c "
          import json
          from app.main import create_app
          json.dump(create_app().openapi(), open('../web/openapi.json', 'w'),
                    ensure_ascii=False, indent=2)
          "

      - name: 타입 재생성 후 차이 확인
        working-directory: web
        run: |
          npm ci
          npm run gen:api
          if ! git diff --exit-code -- src/shared/api/generated.ts; then
            echo "::error::생성된 TS 타입이 백엔드 OpenAPI 와 다릅니다."
            echo "::error::web/ 에서 'npm run gen:api:live' 를 실행하고 결과를 커밋하세요."
            exit 1
          fi
          echo "타입이 스키마와 일치합니다."

  # ---------------------------------------------------------------------------
  docker:
    name: 컨테이너 빌드 (멀티스테이지)
    runs-on: ubuntu-latest
    # generated.ts 가 커밋돼 있지 않으면 웹 빌드 스테이지가 백엔드 기동을 요구해
    # **빌드가 순환**합니다 (UD-3). 이 잡이 그것을 막습니다.
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      - name: 이미지 빌드
        run: docker compose build

      - name: 기동 확인
        run: |
          # 🔴 리눅스에서는 바인드 마운트 소유권을 맞춰야 합니다.
          #    컨테이너가 uid 10001 로 돌기 때문입니다 (README 참조).
          sudo chown -R 10001:10001 data logs
          docker compose up -d
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8200/api/health > /dev/null 2>&1; then
              echo "healthy (${i}0초 이내)"
              curl -s http://127.0.0.1:8200/api/health/ready
              docker compose down
              exit 0
            fi
            sleep 10
          done
          echo "::error::기동에 실패했습니다"
          docker compose logs app
          exit 1
